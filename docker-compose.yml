version: "3.8"

networks:
  frontend-net:
    driver: bridge
  backend-net:
    internal: true # Red aislada para la BD y el Mock

volumes:
  postgres_data:
  keycloak_data:

services:
  # Reverse Proxy / Gateway
  api-gateway:
    image: nginx:1.25-alpine
    container_name: tramites_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - backend-web
      - backend-whatsapp
      - backend-telefonico

  # 1. Backend Canal Web (Atiende la SPA/SSR accesibles)
  backend-web:
    build:
      context: ./backend-web
      dockerfile: Dockerfile
    container_name: tramites_backend_web
    restart: unless-stopped
    user: "node"
    environment:
      PORT: 3001
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-tramites_db}
      DB_USER: ${API_DB_USER:-api_tramites}
      DB_PASSWORD: ${API_DB_PASS:-api_tramites_pass_sec99}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db
      - keycloak
      - padron-mock

  # 2. Backend Canal WhatsApp (Webhook M2M para la API de WhatsApp)
  backend-whatsapp:
    build:
      context: ./backend-whatsapp
      dockerfile: Dockerfile
    container_name: tramites_backend_whatsapp
    restart: unless-stopped
    user: "node"
    environment:
      PORT: 3002
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-tramites_db}
      DB_USER: ${API_DB_USER:-api_tramites}
      DB_PASSWORD: ${API_DB_PASS:-api_tramites_pass_sec99}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db
      - keycloak
      - padron-mock

  # 3. Backend Canal Telefónico (Panel y gestión para Agentes)
  backend-telefonico:
    build:
      context: ./backend-telefonico
      dockerfile: Dockerfile
    container_name: tramites_backend_telefonico
    restart: unless-stopped
    user: "node"
    environment:
      PORT: 3003
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-tramites_db}
      DB_USER: ${API_DB_USER:-api_tramites}
      DB_PASSWORD: ${API_DB_PASS:-api_tramites_pass_sec99}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - db
      - keycloak
      - padron-mock

  # Base de datos compartida aislada en red interna
  db:
    image: postgres:16-alpine
    container_name: tramites_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tramites_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root_pass_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # IdP (Keycloak)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tramites_idp
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASS:-admin123}
      KC_HTTP_RELATIVE_PATH: /
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - frontend-net
      - backend-net

  # Mock Padrón Nacional
  padron-mock:
    build: ./padron-mock
    container_name: tramites_padron_mock
    restart: unless-stopped
    networks:
      - backend-net

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.11.0
    container_name: tramites_swagger_ui
    restart: unless-stopped
    ports:
      - "8080:8080" # Expone Swagger UI en el puerto 8080 del host
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro # Monta tu contrato local dentro del contenedor
    networks:
      - frontend-net
