events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    server {
        listen 80;

        # Enrutamiento hacia Keycloak (OIDC)
        location /realms/ {
            proxy_pass http://keycloak:8080/realms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Canal Telefónico 
        location /api/v1/telefonico/ {
            proxy_pass http://backend-telefonico:3003/api/v1/;
            proxy_set_header Host $host;
        }

        # Canal Web 
        location /api/v1/web/ {
            proxy_pass http://backend-web:3001/api/v1/;
            proxy_set_header Host $host;
        }

        # Canal WhatsApp 
        location /api/v1/whatsapp/ {
            proxy_pass http://backend-whatsapp:3002/api/v1/;
            proxy_set_header Host $host;
        }
    }
}