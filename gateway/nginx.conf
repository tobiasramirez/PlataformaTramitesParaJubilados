events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;
    server {
        listen 80;

        # Enrutamiento hacia Keycloak (OIDC)
        location /realms/ {
            proxy_pass http://keycloak:8080/realms/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Canal Telefónico 
        location /api/v1/telefonico/ {
            proxy_pass http://backend-telefonico:3003/api/v1/;
            proxy_set_header Host $host;
        }

       # Canal Web (puerto 3001)
        location /api/v1/web/ {
            # Soporte CORS para Swagger UI (localhost:8080)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept' always;

            set $web_upstream http://backend-web:3001;
            rewrite ^/api/v1/web/(.*)$ /api/v1/$1 break;
            proxy_pass $web_upstream;
            proxy_set_header Host $host;
        }

        # Canal WhatsApp 
        location /api/v1/whatsapp/ {
            proxy_pass http://backend-whatsapp:3002/api/v1/;
            proxy_set_header Host $host;
        }
    }
}