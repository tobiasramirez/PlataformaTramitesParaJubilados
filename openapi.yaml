openapi: 3.0.3
info:
  title: API Plataforma Regional de Trámites para Jubilados
  version: 1.0.0
  description: |
    API REST para la gestión multicanal e intermunicipal de solicitudes de beneficios
    para jubilados (Dominio 7B). Implementa respuestas de error según RFC 9457 (Problem Details).
servers:
  - url: http://localhost:3001
    description: Servidor principal (Gateway) 
paths:
  /tramites:
    post:
      summary: Iniciar una nueva solicitud de trámite (Vecino o Agente por teléfono)
      operationId: crearTramite
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrearTramiteRequest"
      responses:
        "201":
          description: Trámite creado exitosamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TramiteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "422":
          $ref: "#/components/responses/422UnprocessableEntity"
        "500":
          $ref: "#/components/responses/500InternalServerError"

    get:
      summary: Listar trámites (Bandeja del Agente Municipal / Historial del Vecino)
      operationId: listarTramites
      security:
        - BearerAuth: []
      parameters:
        - name: municipioId
          in: query
          required: false
          schema:
            type: integer
          description: Filtrar por municipio (Regla fina ABAC para Agente)
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [PENDIENTE_VALIDACION, APROBADO, RECHAZADO]
      responses:
        "200":
          description: Lista de trámites obtenida con éxito.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TramiteResponse"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "500":
          $ref: "#/components/responses/500InternalServerError"

  /tramites/{id}:
    get:
      summary: Consultar detalle de un trámite por ID
      operationId: obtenerTramitePorId
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle del trámite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TramiteResponse"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500InternalServerError"

  /tramites/{id}/estado:
    patch:
      summary: Evaluar / Cambiar estado de un trámite (Solo Agente Municipal)
      operationId: cambiarEstadoTramite
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvaluacionTramiteRequest"
      responses:
        "200":
          description: Estado del trámite actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TramiteResponse"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401Unauthorized"
        "403":
          $ref: "#/components/responses/403Forbidden"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500InternalServerError"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token Bearer OIDC obtenido mediante Keycloak.

  schemas:
    CrearTramiteRequest:
      type: object
      required:
        - cuilJubilado
        - municipioId
        - tipoBeneficioId
        - canalOrigen
      properties:
        cuilJubilado:
          type: string
          pattern: '^\d{11}$'
          example: "20123456789"
        municipioId:
          type: integer
          example: 4
          description: ID del municipio (1 a 12)
        tipoBeneficioId:
          type: string
          example: "TARIFA_SOCIAL_SUBTE"
        canalOrigen:
          type: string
          enum: [WEB, WHATSAPP, TELEFONICO]
          example: "WHATSAPP"
        datosAdicionales:
          type: object
          description: Campos dinámicos requeridos según las reglas del municipio.
          additionalProperties: true

    EvaluacionTramiteRequest:
      type: object
      required:
        - estado
        - observacion
      properties:
        estado:
          type: string
          enum: [APROBADO, RECHAZADO]
          example: "APROBADO"
        observacion:
          type: string
          maxLength: 500
          example: "Cumple con los requisitos del padrón y tarifa social municipal."

    TramiteResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "d3b07384-d113-424a-80c7-3b95764d2d64"
        cuilJubilado:
          type: string
          example: "20123456789"
        municipioId:
          type: integer
          example: 4
        tipoBeneficioId:
          type: string
          example: "TARIFA_SOCIAL_SUBTE"
        canalOrigen:
          type: string
          example: "WHATSAPP"
        estado:
          type: string
          enum: [PENDIENTE_VALIDACION, APROBADO, RECHAZADO]
          example: "PENDIENTE_VALIDACION"
        verificadoEnPadron:
          type: boolean
          example: true
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-11-03T10:15:30Z"
        evaluacion:
          type: object
          nullable: true
          properties:
            agenteId:
              type: string
              example: "agente_perez"
            fechaEvaluacion:
              type: string
              format: date-time
            observacion:
              type: string

    # Esquema Estándar Problem Details (RFC 9457)
    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: "https://tramites.consorcio.gob.ar/errors/invalid-request"
        title:
          type: string
          example: "Parámetros de solicitud inválidos"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "El CUIL ingresado no cumple con el formato de 11 dígitos esperados."
        instance:
          type: string
          format: uri
          example: "/tramites"

  responses:
    400BadRequest:
      description: Solicitud mal formada o falla de validación sintáctica.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    401Unauthorized:
      description: Credenciales de autenticación ausentes o inválidas.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    403Forbidden:
      description: El usuario no posee los roles/permisos necesarios para realizar la acción.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    404NotFound:
      description: El recurso solicitado no existe.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    422UnprocessableEntity:
      description: Error de regla de negocio (ej. el jubilado no figura en el padrón nacional).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"

    500InternalServerError:
      description: Error interno del servidor (se responde sin filtrar información interna).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
